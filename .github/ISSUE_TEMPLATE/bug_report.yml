name: 🐞 Bug 反馈 / Bug report
description: 崩溃、启动失败、配置同步错误或功能异常 / Crashes, startup failures, sync errors, or broken features
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请确认 / Before submitting

        本仓库按发行线处理问题。请先对照 [分支表](https://github.com/q14433686-arch/TaCZTweaks_Unofficial/blob/26.2(main)/docs/BRANCHES.md) 选择 **Minecraft 版本 + Fabric/NeoForge**，只使用该线发布的文件。请不要把本移植产生的问题提交给原版 TaCZ Tweaks、TaCZ 或兼容模组的作者。

        请先搜索 open 和 closed issues。中文或 English 均可。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Pre-submit checklist
      options:
        - label: 我已搜索 open 和 closed issues，没有找到相同问题 / I searched open and closed issues for duplicates.
          required: true
        - label: 我使用的是本项目发布页提供的文件，而不是自行编译或第三方转载文件 / I use a file published by this project, not a third-party build.
          required: true
        - label: 我确认问题涉及本仓库对应发行线，而不是仅安装底层 TaCZ 移植时也会发生的问题 / I confirmed the issue involves this port line and is not reproducible with TaCZ alone.
          required: true

  - type: dropdown
    id: release_line
    attributes:
      label: 发行线 / Release line
      description: 必须与所用 jar 的 Git 分支一致 / Must match the branch that published the file you installed.
      options:
        - 26.2(main) — Fabric 26.2
        - 26.2-neoforge — NeoForge 26.2
        - 26.1.2 — Fabric 26.1.2
        - 26.1.2-neoforge — NeoForge 26.1.2
        - 1.21.11 — Fabric 1.21.11
        - 1.21.11-neoforge — NeoForge 1.21.11
        - 不确定 / Unsure
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: Minecraft 版本 / Minecraft version
      description: 完整值，例如 26.2、26.1.2 或 1.21.11；“最新版”无效 / Exact value; “latest” is not sufficient.
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: 本模组版本 / Mod version
      description: 从文件名或模组列表复制完整版本号 / Copy the complete version from the file name or mod list.
    validations:
      required: true

  - type: textarea
    id: dependency_versions
    attributes:
      label: 加载器与必需依赖版本 / Loader and required dependency versions
      description: 按你的发行线填写。Fabric 线：Fabric Loader、Fabric API、Fabric Language Kotlin、TaCZ Refabricated Unofficial、YACL。NeoForge 线：NeoForge、TaCZ Renovated、YACL。每行一个完整名称与版本 / One exact name and version per line for your loader line.
      render: text
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: 出现环境 / Side
      options:
        - 单人游戏 / Single-player
        - 局域网联机 / LAN
        - 多人服务器（客户端异常） / Multiplayer server (client issue)
        - 多人服务器（服务端异常） / Multiplayer server (server issue)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 实际表现与预期表现 / Actual and expected behavior
      description: 分开说明实际发生了什么，以及你预期发生什么 / Describe the actual and expected behavior separately.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤 / Minimal reproduction steps
      description: 从新建存档或启动测试服务器开始，列出每一步和所用枪械、配件、配置 / Start from a new world or test server and list every relevant item and setting.
      placeholder: |
        1. 使用默认配置启动最小环境
        2. 新建存档并获取……
        3. 执行……
        4. 观察到……
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 复现概率 / Reproduction frequency
      options:
        - 每次必现 / Always
        - 经常出现 / Often
        - 偶尔出现 / Sometimes
        - 只出现过一次 / Once
    validations:
      required: true

  - type: dropdown
    id: minimal_environment
    attributes:
      label: 是否在最小环境复现？ / Reproduced in a minimal environment?
      description: 最小环境仅包含本模组及其必需依赖，不包含可选兼容模组、光影或额外内容包 / Use only this mod and its required dependencies.
      options:
        - 是 / Yes
        - 否，只在加入其他内容后出现 / No, only with additional content
        - 尚未测试 / Not tested
    validations:
      required: true

  - type: input
    id: log_link
    attributes:
      label: 完整日志或崩溃报告链接 / Full log or crash-report link
      description: 上传完整 latest.log 或 crash report 到 mclo.gs、GitHub Gist 等文本托管服务。单行报错或截图不能代替完整日志 / Upload the complete text; screenshots and isolated error lines are insufficient.
      placeholder: "https://mclo.gs/..."
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 相关配置 / Relevant configuration
      description: 列出修改过的相关选项；也可拖入配置文件。若使用默认配置请明确写出 / List changed options or attach the config; state clearly if defaults are used.

  - type: textarea
    id: additional_content
    attributes:
      label: 枪包、可选模组和其他模组 / Gun packs, optional integrations, and other mods
      description: 每行填写准确名称与完整版本。若没有请写“无” / Give exact names and versions, or write “none”.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充材料 / Additional evidence
      description: 可拖入截图、录屏、存档或数据包。请勿仅用截图代替日志 / Attach screenshots, recordings, worlds, or data packs; do not replace logs with screenshots.
