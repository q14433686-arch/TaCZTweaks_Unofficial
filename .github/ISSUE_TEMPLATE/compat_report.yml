name: 内容包 / 兼容性问题
description: 第三方枪包、数据包、资源包或可选模组的兼容问题
title: "[Compat] "
labels: ["compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        此模板用于只在特定第三方内容或可选模组存在时发生的问题。兼容并不代表本项目拥有或维护该第三方内容；请同时确认其作者声明支持你的游戏与加载器环境。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Pre-submit checklist
      options:
        - label: 我已搜索 open 和 closed issues，没有找到相同报告
          required: true
        - label: 我已阅读第三方内容作者列出的安装方式、依赖和许可
          required: true
        - label: 移除该第三方内容后问题不再发生
          required: true

  - type: input
    id: game_version
    attributes:
      label: Minecraft 版本
      description: 请填写完整值，不要写“最新版”
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: TaCZ Tweaks (Renovated) 完整版本
    validations:
      required: true

  - type: textarea
    id: dependency_versions
    attributes:
      label: 加载器、TaCZ 与必需依赖版本
      description: 每行一个准确名称与完整版本
      render: text
    validations:
      required: true

  - type: input
    id: content_name
    attributes:
      label: 第三方内容的准确名称与版本
    validations:
      required: true

  - type: input
    id: content_source
    attributes:
      label: 第三方内容的官方发布页或源码链接
    validations:
      required: true

  - type: textarea
    id: declared_dependencies
    attributes:
      label: 第三方作者列出的前置依赖与安装方法
      description: 请按发布页原文列出，不要根据文件内容猜测
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 具体表现、预期表现与复现步骤
    validations:
      required: true

  - type: input
    id: log_link
    attributes:
      label: 完整 latest.log 或崩溃报告链接
      placeholder: "https://mclo.gs/..."
    validations:
      required: true

  - type: textarea
    id: other_mods
    attributes:
      label: 其他已安装模组
      description: 每行一个准确名称与完整版本；没有则写“无”
      render: text
    validations:
      required: true
