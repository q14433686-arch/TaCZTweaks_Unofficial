name: audit

# 本仓库独有的静态门禁（TaCZ 那边没有对应流程）。
# scripts/audit_port.py --strict 检查的是「编译通过也发现不了」的那一类错误：
#   * mixin 类漏登记 / 拼错在 tacztweaks.mixins.json 里；
#   * mixin 指向 TaCZ jar 里根本不存在的方法（混淆端口最常见的静默失效）；
#   * common mixin 打到 @Environment(CLIENT) 方法上（专服会崩）；
#   * 配置项被持久化/同步但没有任何行为代码读取；
#   * 语言键漂移、图标元数据与校验和漂移、MixinExtras 版本低于 mixin JSON 声明的下限。
#
# 它只用 Python 标准库，不需要 Gradle、不需要下载 Minecraft —— 唯一的外部输入是
# libs/ 里的 TaCZ jar（用来核对 mixin 目标方法确实存在），所以必须先重建依赖。
# 跑得比 build 快得多，值得独立成一条，让 mixin 目标漂移能第一时间报出来。
#
# 与 26.3 线的差异：那边这一步还会跑 scripts/test_audit_optional_targets.py，
# 该文件测的是 26.x **未混淆** classpath 上的 remap=false 可选 @At 目标
# （BlocksAttacks / hurtBlockingItem 5 参 vs 6 参）。本 1.21.11 分支是**混淆 + Loom remap**
# 端口，audit_port.py 实现与目标类名都不同，那个自测在这里没有对应物，因此不移植。
# 依赖区间回归测试放在 consistency.yml（纯 Python、最快的那条）。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - '1.21.11'
      - '26.3'
      - '26.2(main)'
      - '26.1.2'
    paths-ignore:
      - 'build-reports/**'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore vendored dependencies
        run: python3 scripts/download_dependencies.py --print-sha256

      # mixin 目标核对依赖 libs/ 里的 TaCZ jar，所以必须放在上一步之后。
      - name: Static port audit (0 error / 0 warning required)
        run: python3 scripts/audit_port.py --strict

      - name: Release consistency (dependencies restored)
        run: python3 scripts/check_release_consistency.py --require-deps
