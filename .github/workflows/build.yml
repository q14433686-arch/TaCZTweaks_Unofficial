name: build

# 全量构建 + 产物上传。
# compile-check 只跑 compileJava/compileKotlin，测不出 processResources、jar、
# checkModIcon / checkVendoredDependencies / checkJarContents 与 JUnit 阶段的失败，也不产 jar。
#
# * linux：./gradlew build，再用 check_release_consistency.py --jar 复核产物，并把 jar 与
#   示例包传成 Actions artifact（留 14 天），给实机测试者一个下载链接。
# * windows：gradlew.bat build。维护者与多数玩家在 Windows 上构建，build.gradle.kts 里有
#   专门的 Windows 处理（测试 worker 运行时暂存到 ASCII 路径、图标门禁的 py/python 探测），
#   这条 job 防止它们静默失效（沿用原 docs/maintenance/ci-workflow.yml 的 Windows 设计）。
#
# 两个 job 都把日志要点写进 job annotation（scripts/ci_log_annotation.py），受限沙箱可读。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - '26.3'
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/26.1.2' }}

      - name: Restore vendored dependencies (SHA-256 checked)
        run: python3 scripts/download_dependencies.py

      # ./gradlew build 已包含 check：JUnit 测试与 checkModIcon / checkVendoredDependencies /
      # checkJarContents 三个门禁都在里面。
      - name: Full build
        run: |
          mkdir -p build-reports
          ./gradlew build --console=plain --stacktrace --no-daemon 2>&1 | tee build-reports/gradle-build.log

      - name: Release consistency against the built jar
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          JAR="build/libs/tacztweaks-${VERSION}.jar"
          test -f "$JAR" || { echo "::error::expected release jar $JAR was not built"; exit 1; }
          echo "checking $JAR"
          python3 scripts/check_release_consistency.py --jar "$JAR"

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          # artifact 名不能含 '/'（arena/xxx 会直接失败），分支名在 run 页面上就有，这里只放 sha。
          name: tacztweaks-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload example pack
        uses: actions/upload-artifact@v7
        with:
          name: tacz-tweaks-example-pack-${{ github.sha }}
          path: build/distributions/*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Report build log (readable via the annotations API)
        if: always()
        run: python3 scripts/ci_log_annotation.py --title "build (linux)" --status "${{ job.status }}" build-reports/gradle-build.log

  windows:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # 让 checkout 的文本文件与 Linux 一致（.gitattributes 之外的文件不被转成 CRLF）。
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/26.1.2' }}

      - name: Restore vendored dependencies (SHA-256 checked)
        run: python scripts/download_dependencies.py

      # cmd + 重定向：保留 gradlew.bat 的真实退出码，构建完再把日志打印出来。
      - name: Full build (gradlew.bat)
        shell: cmd
        run: |
          if not exist build-reports mkdir build-reports
          call gradlew.bat build --console=plain --stacktrace --no-daemon > build-reports\gradle-build.log 2>&1
          set RC=%ERRORLEVEL%
          type build-reports\gradle-build.log
          exit /b %RC%

      - name: Report build log (readable via the annotations API)
        if: always()
        run: python scripts/ci_log_annotation.py --title "build (windows)" --status "${{ job.status }}" build-reports/gradle-build.log
