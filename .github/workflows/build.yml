name: build

# 全量构建 + 产物上传。
# compile-check 只跑 compileJava/compileKotlin，测不出 processResources、jar、
# checkModIcon / checkVendoredDependencies / checkJarContents 与 JUnit 阶段的失败，也不产 jar。
# 本流程跑 ./gradlew build 并把 jar 传成 Actions artifact（留 14 天）——
# 直接用途：给实机征测者一个下载链接；每轮改动随手有可实测的构建。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - '26.3'
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore vendored dependencies
        run: python3 scripts/download_dependencies.py --print-sha256

      # ./gradlew build 已经包含 check，也就同时跑了 JUnit 测试与
      # checkModIcon / checkVendoredDependencies / checkJarContents 三个门禁。
      - name: Full build
        run: ./gradlew build --console=plain --stacktrace --no-daemon

      - name: Release consistency against the built jar
        run: |
          JAR=$(ls build/libs/tacztweaks-*.jar | grep -v -- '-sources.jar' | head -n1)
          echo "checking $JAR"
          python3 scripts/check_release_consistency.py --jar "$JAR"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          # 注意：artifact 名不能含 '/' 等字符，所以不能用 github.ref_name
          # （arena/xxx 带斜杠会直接失败）。分支名在 run 页面本来就有，名字里只放 sha。
          name: tacztweaks-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload example pack
        uses: actions/upload-artifact@v4
        with:
          name: tacz-tweaks-example-pack-${{ github.sha }}
          path: build/distributions/*.zip
          retention-days: 14
          if-no-files-found: warn
