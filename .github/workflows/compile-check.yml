name: compile-check

# 快速编译验证（对标 26.3 线与 TaCZ_Refabricated_Unofficial 的同名流程）。
#
# 本仓库的开发沙箱（Arena / 受限容器）通常只能访问 api.github.com：maven.fabricmc.net、
# api.modrinth.com、piston-meta.mojang.com 和 GitHub release 附件域都不可达，本地跑不了
# ./gradlew，Actions 的日志正文（blob 域）也读不到。
#
# 26.3 线把编译日志 commit 回 build-reports/compile-java.log；本线改为把日志要点写进
# **job annotation**（scripts/ci_log_annotation.py），沙箱用 REST API 就能读到：
#   gh api repos/{owner}/{repo}/actions/runs/{run_id}/jobs --jq '.jobs[] | "\(.id) \(.name) \(.conclusion)"'
#   gh api repos/{owner}/{repo}/check-runs/{job_id}/annotations --jq '.[].message'
# 好处：不往 PR 里塞 CI commit（那会让 PR 头提交挂上待批准 / 失败的检查），也不需要写权限。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - '26.3'
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的过期 run 直接取消，省配额（push 连发时只编最新的）
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          # 默认只有仓库默认分支（26.2(main)）写缓存；让本发行线自己的 push 也写，PR 可复用。
          cache-read-only: ${{ github.ref != 'refs/heads/26.1.2' }}

      # libs/*.jar 不在 Git 里（见 .gitignore），必须先按 manifest 重建，
      # 否则 compileJava 会因为找不到 mixin 目标类而全盘失败。
      - name: Restore vendored dependencies (SHA-256 checked)
        run: python3 scripts/download_dependencies.py

      - name: compileJava / compileKotlin
        run: |
          mkdir -p build-reports
          {
            echo "commit: ${{ github.sha }}"
            echo "ref: ${{ github.ref_name }}"
          } > build-reports/compile.log
          ./gradlew compileJava compileKotlin --console=plain --stacktrace --no-daemon 2>&1 \
            | tee -a build-reports/compile.log

      - name: Report compile log (readable via the annotations API)
        if: always()
        run: python3 scripts/ci_log_annotation.py --title "compile" --status "${{ job.status }}" build-reports/compile.log
