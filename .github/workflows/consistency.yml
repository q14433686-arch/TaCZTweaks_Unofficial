name: Version consistency

# 版本一致性守门：改了 gradle.properties 却忘了同步 README / BUILD.md / fabric.mod.json 时，PR 会红。
# build.yml 虽然也跑同一脚本，但它 paths-ignore 掉了 *.md 与 docs/**，
# 「只改 README」的提交测不到 —— 本流程必须独立存在。
# 一致性脚本不需要 libs/ 里的 jar（只校验 manifest 行）；另跑上游可用性与小型回归测试，
# 避免完整编译/打包前漏掉 metadata 和依赖区间问题。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - '26.3'
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    paths:
      - 'gradle.properties'
      - 'README.md'
      - 'BUILD.md'
      - 'CHANGELOG.md'
      - 'RESOURCE_IMPORT_MANIFEST.tsv'
      - 'src/main/resources/fabric.mod.json'
      - 'docs/publish/**'
      - 'docs/BRANCHES.md'
      - 'docs/COMPATIBILITY.md'
      - 'docs/CROSS_BRANCH_SYNC.md'
      - 'docs/PORT_26_3_STATUS.md'
      - 'scripts/check_release_consistency.py'
      - 'scripts/check_dependency_availability.py'
      - 'scripts/test_dependency_ranges.py'
      - 'scripts/validate_release_tag.py'
      - 'scripts/test_validate_release_tag.py'
      - '.github/workflows/consistency.yml'
  pull_request:
    paths:
      - 'gradle.properties'
      - 'README.md'
      - 'BUILD.md'
      - 'CHANGELOG.md'
      - 'RESOURCE_IMPORT_MANIFEST.tsv'
      - 'src/main/resources/fabric.mod.json'
      - 'docs/publish/**'
      - 'docs/BRANCHES.md'
      - 'docs/COMPATIBILITY.md'
      - 'docs/CROSS_BRANCH_SYNC.md'
      - 'docs/PORT_26_3_STATUS.md'
      - 'scripts/check_release_consistency.py'
      - 'scripts/check_dependency_availability.py'
      - 'scripts/test_dependency_ranges.py'
      - 'scripts/validate_release_tag.py'
      - 'scripts/test_validate_release_tag.py'
      - '.github/workflows/consistency.yml'
  workflow_dispatch:

concurrency:
  group: consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 版本、依赖与上游可用性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查当前分支
        run: python3 scripts/check_release_consistency.py

      - name: 检查 Modrinth 上游依赖是否可用
        run: python3 scripts/check_dependency_availability.py

      - name: 依赖范围与 Release tag 回归测试
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/test_dependency_ranges.py scripts/test_validate_release_tag.py -q

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::版本/依赖一致性、Modrinth 上游可用性或依赖/tag 回归检查失败。"
          echo "::error::请先查看前序步骤输出，再同步 README / BUILD / CHANGELOG / fabric.mod.json。"
          echo "::error::同时检查 gradle.properties、RESOURCE_IMPORT_MANIFEST.tsv 和发布 tag 映射。"
