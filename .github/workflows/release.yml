name: GitHub Release

# 只有推送到 26.1.2 线的发行 tag 才会走这条流程；普通 push 与 PR 不发布任何东西。
#
# 两种发版方式都支持：
#   A. 本地 git tag + push       -> 本流程创建 Release，附上 CI 构建的 jar 与自动发行说明；
#   B. 网页上「Draft a new release」并填新 tag 发布 -> tag 推送触发本流程；Release 已存在时
#      只补传 CI 构建的 jar（同名文件已手动上传则保留，不覆盖），标题与说明不动。
#
# tag 必须以 26.1.2_ 或 26.1.2- 开头，后缀与 gradle.properties 的 mod_version 一致，
# 比较时忽略 '_' / '-' 与大小写（scripts/check_release_tag.py）：
#   2.14.2+fabric.26.1.2.Beta-1-hotfix2 -> 26.1.2_BETA_1_HOTFIX2（或 26.1.2_BETA_1_HOTFIX-2 ...）
# 26.3 线的同名流程只认一种写法，2026-10-15 因此拒绝了 26.3_BETA_1_HOTFIX-1；本线放宽了这一点。

on:
  push:
    tags:
      - '26.1.2_*'
      - '26.1.2-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the 26.1.2 release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and target branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/check_release_tag.py "$RELEASE_TAG"

          git fetch --no-tags origin +refs/heads/26.1.2:refs/remotes/origin/26.1.2
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/26.1.2; then
            echo "::error::Release tag '$RELEASE_TAG' ($TAG_SHA) is not on the 26.1.2 branch; merge the PR first and tag the 26.1.2 head."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore vendored dependencies (SHA-256 checked)
        run: python3 scripts/download_dependencies.py

      - name: Static port audit
        run: python3 scripts/audit_port.py --strict

      - name: Release consistency and dependency-range tests
        run: |
          python3 scripts/check_release_consistency.py
          python3 scripts/test_dependency_ranges.py

      - name: Full release build
        run: |
          mkdir -p build-reports
          ./gradlew clean build --console=plain --stacktrace --no-daemon 2>&1 | tee build-reports/gradle-build.log

      - name: Verify release jar metadata
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          JAR="build/libs/tacztweaks-${VERSION}.jar"
          test -f "$JAR" || { echo "::error::expected release jar $JAR was not built"; exit 1; }
          echo "checking $JAR"
          python3 scripts/check_release_consistency.py --jar "$JAR"
          echo "RELEASE_JAR=$JAR" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create the GitHub Release, or attach the jar to the existing one
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          JAR_NAME="$(basename "$RELEASE_JAR")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Created by hand in the web UI (its tag push started this run).
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$JAR_NAME"; then
              echo "::notice::Release $RELEASE_TAG already has $JAR_NAME; keeping the uploaded file."
            else
              gh release upload "$RELEASE_TAG" "$RELEASE_JAR"
              echo "::notice::Attached the CI-built $JAR_NAME to the existing release $RELEASE_TAG."
            fi
          else
            gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
              --verify-tag \
              --title "TaCZ Tweaks (Refabricated) $MOD_VERSION" \
              --generate-notes
          fi

      - name: Report build log (readable via the annotations API)
        if: always()
        run: python3 scripts/ci_log_annotation.py --title "release build" --status "${{ job.status }}" build-reports/gradle-build.log
