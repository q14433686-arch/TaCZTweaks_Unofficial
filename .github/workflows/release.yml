name: GitHub Release

# Only a deliberately pushed 1.21.11 release tag can publish a GitHub Release.
# PRs and ordinary branch pushes never publish anything.
#
# Synced from the 26.3 line's release.yml, with three branch-specific changes:
#   * tag prefix is 1.21.11_* and the tag must sit on the `1.21.11` branch;
#   * mod_version must identify the +fabric.1.21.11. line;
#   * JDK 21, not 25 — this is the obfuscated Loom-remap port (see BUILD.md).

on:
  push:
    tags:
      - '1.21.11_*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the 1.21.11 release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and target branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ -z "$VERSION" || "$VERSION" != *+fabric.1.21.11.* ]]; then
            echo "::error::mod_version must identify the Fabric 1.21.11 line (got '$VERSION')"
            exit 1
          fi

          SUFFIX="${VERSION#*+fabric.1.21.11.}"
          if [[ -z "$SUFFIX" || "$SUFFIX" == "$VERSION" ]]; then
            echo "::error::Could not extract the 1.21.11 release suffix from '$VERSION'"
            exit 1
          fi
          TAG_SUFFIX="$(printf '%s' "$SUFFIX" | tr '[:lower:]' '[:upper:]' | sed -E 's/[.-]/_/g')"
          EXPECTED_TAG="1.21.11_${TAG_SUFFIX}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag '$RELEASE_TAG' does not match mod_version '$VERSION'; expected '$EXPECTED_TAG'"
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/1.21.11:refs/remotes/origin/1.21.11
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/1.21.11; then
            echo "::error::Release tag '$RELEASE_TAG' is not on the 1.21.11 branch"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This branch targets obfuscated Minecraft 1.21.11 with Loom remap and requires JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore vendored dependencies
        run: python3 scripts/download_dependencies.py --print-sha256

      - name: Static port audit
        run: python3 scripts/audit_port.py --strict

      - name: Dependency-range regression tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/test_dependency_ranges.py -q

      - name: Full release build
        run: ./gradlew clean build --console=plain --stacktrace --no-daemon

      - name: Verify release jar metadata
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          JAR="build/libs/tacztweaks-${VERSION}.jar"
          test -f "$JAR"
          echo "checking $JAR"
          python3 scripts/check_release_consistency.py --require-deps --jar "$JAR"
          echo "RELEASE_JAR=$JAR" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload example pack alongside the release
        run: |
          set -euo pipefail
          PACK="build/distributions/tacz-tweaks-example-pack-${MOD_VERSION}.zip"
          if [[ -f "$PACK" ]]; then
            echo "EXAMPLE_PACK=$PACK" >> "$GITHUB_ENV"
          else
            echo "no example pack at $PACK; publishing the mod jar only"
            echo "EXAMPLE_PACK=" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS=("$RELEASE_JAR")
          if [[ -n "${EXAMPLE_PACK:-}" ]]; then ASSETS+=("$EXAMPLE_PACK"); fi
          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --verify-tag \
            --title "TaCZ Tweaks (Refabricated) $MOD_VERSION" \
            --generate-notes
