plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
}

// Mojang ships Java 25 to end users in 26.1.2, so this port targets Java 25 —
// same toolchain as TaCZ_Renovated's 26.1.2 branch.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin {
    jvmToolchain(25)
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// ---------------------------------------------------------------------------
// Local binary dependencies.
//
// They are NOT committed to Git (see .gitignore); fetch them with
//   python3 scripts/download_dependencies.py
// and verify with
//   python3 scripts/download_dependencies.py --check-only
// Sources and SHA-256 digests live in RESOURCE_IMPORT_MANIFEST.tsv.
// ---------------------------------------------------------------------------
ext.taczJar = file("libs/tacz-1.1.8+neoforge.26.1.2.R1.jar")
ext.yaclJar = file("libs/yet-another-config-lib-v3-3.9.6+26.1-neoforge.jar")
ext.soundPhysicsJar = file("libs/sound-physics-remastered-neoforge-1.5.1+26.1.2.jar")
ext.firstAidJar = file("libs/firstaid-1.2.8+neoforge26.1.jar")
ext.pillagersGunJar = file("libs/pillagers_gun-3.2.2-neoforge-26.1.2.jar")
ext.commonsMathJar = file("libs/commons-math3-3.6.1.jar")

neoForge {
    // ModDevGradle 2.x settings object. disableRecompilation skips Vineflower
    // (-Xmx4g by default), which OOMs low-memory build machines/CI sandboxes.
    // Set it back to false on a dev box to get Minecraft sources in the IDE.
    enable {
        version = project.neo_version
        disableRecompilation = true
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            jvmArguments.addAll '-Xms128M', '-Xmx2G'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // NeoForge has no Fabric Language Kotlin equivalent: the stdlib has to ship with us.
    jarJar "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"

    // --- Required on the compile classpath (see checkRequiredDependencies) ---
    // TaCZ: Renovated (unofficial NeoForge port) is the mixin/API target.
    compileOnly files(taczJar)
    localRuntime files(taczJar)

    // Config screen library (dev.isxander.yacl3.*).
    compileOnly files(yaclJar)
    localRuntime files(yaclJar)

    // Sound Physics Remastered: optional at runtime, but the compat mixin/bridge references
    // com.sonicether.soundphysics.* directly, so the jar is needed to compile.
    compileOnly files(soundPhysicsJar)

    // commons-math3 is bundled inside the TaCZ jar; compile-time only for us.
    compileOnly files(commonsMathJar)

    // --- Truly optional: First Aid and Pillager's Gun are reached through reflection and
    // string-target mixins, so they are only added when the jar happens to be present. ---
    if (firstAidJar.exists()) {
        compileOnly files(firstAidJar)
    }
    if (pillagersGunJar.exists()) {
        compileOnly files(pillagersGunJar)
    }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Pure-JDK unit tests only (version gate, codecs that need no Minecraft classes).
    // The test source set is not fed through ModDevGradle.
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs '-Xmx512m', '-XX:ReservedCodeCacheSize=128m'
}

// ---------------------------------------------------------------------------
// neoforge.mods.toml templating (mod_version etc.)
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// ---------------------------------------------------------------------------
// Release gates (pure Gradle/Groovy: no Python interpreter required)
// ---------------------------------------------------------------------------
def sha256Of = { File f ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(f.bytes).collect { String.format('%02x', it) }.join()
}

/** Required compile-time jars, with a human-readable source for the error message. */
ext.requiredLocalDependencies = [
        (taczJar)        : 'https://github.com/q14433686-arch/TaCZ_Renovated/releases/tag/26.1.2_R1',
        (yaclJar)        : 'CurseForge / Modrinth: YetAnotherConfigLib "3.9.6 for neoforge 26.1"',
        (soundPhysicsJar): 'CurseForge: Sound Physics Remastered "[NEOFORGE][26.1.2] 1.5.1+26.1.2"',
        (commonsMathJar) : 'https://repo1.maven.org/maven2/org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar',
]

var checkRequiredDependencies = tasks.register("checkRequiredDependencies") {
    group = 'verification'
    description = 'Fails early with a readable message when a required libs/ jar is missing.'
    doLast {
        def missing = requiredLocalDependencies.findAll { file, source -> !file.exists() }
        if (missing) {
            def lines = missing.collect { file, source ->
                "  - libs/${file.name}\n      source: ${source}"
            }.join('\n')
            throw new GradleException(
                    "Missing required compile dependencies. Put these jars in libs/ (they are not\n" +
                    "committed to Git; see libs/README.txt and RESOURCE_IMPORT_MANIFEST.tsv):\n" +
                    lines + "\n" +
                    "Without them the Kotlin/Java compile fails with hundreds of\n" +
                    "'Unresolved reference: tacz / dev / com.sonicether' errors.")
        }
    }
}

tasks.named('compileJava') { dependsOn checkRequiredDependencies }
tasks.named('compileKotlin') { dependsOn checkRequiredDependencies }

var checkModIcon = tasks.register("checkModIcon") {
    group = 'verification'
    description = 'Verifies the mod icon checksum, metadata path, dimensions, and license notice.'
    def metadataFile = file('src/main/templates/META-INF/neoforge.mods.toml')
    def iconFile = file('src/main/resources/icon.png')
    def noticeFile = file('THIRD_PARTY_NOTICES.md')
    inputs.file(metadataFile)
    inputs.file(iconFile)
    inputs.file(noticeFile)
    doLast {
        def expectedSha = 'c8591fdd552d0bbad05cd8a60136faf89d5e9fd6d0dab08eb96fa04439c6db9d'
        def rejectedSha = '5e1272a625af1b0b4d866d0fb468e1cea0a9258411f16a7d06d31a84e8953ac8'
        def errors = []

        def logo = (metadataFile.text =~ /(?m)^logoFile\s*=\s*"([^"]+)"/)
        if (!logo.find() || logo.group(1) != 'icon.png') {
            errors << 'neoforge.mods.toml logoFile must be "icon.png"'
        }

        def bytes = iconFile.bytes
        def digest = sha256Of(iconFile)
        if (digest == rejectedSha) {
            errors << 'mod icon is the known dark-grey/orange placeholder'
        } else if (digest != expectedSha) {
            errors << "mod icon SHA-256 drifted: expected ${expectedSha}, got ${digest}"
        }

        // PNG signature (0x89 'P' 'N' 'G') + IHDR chunk type, compared as unsigned ints.
        def octet = { int index -> bytes[index] & 0xFF }
        if (bytes.length < 24 || octet(0) != 0x89 || octet(1) != 0x50
                || octet(2) != 0x4E || octet(3) != 0x47
                || octet(12) != 0x49 || octet(13) != 0x48
                || octet(14) != 0x44 || octet(15) != 0x52) {
            errors << 'mod icon is not a PNG with a valid leading IHDR chunk'
        } else {
            def readInt = { int off ->
                (octet(off) << 24) | (octet(off + 1) << 16) |
                        (octet(off + 2) << 8) | octet(off + 3)
            }
            int width = readInt(16)
            int height = readInt(20)
            if (width != 512 || height != 512) {
                errors << "mod icon must be 512x512, got ${width}x${height}"
            }
        }

        def notice = noticeFile.text
        if (!notice.contains(expectedSha)) {
            errors << 'THIRD_PARTY_NOTICES.md does not record the current icon SHA-256'
        }

        if (errors) {
            throw new GradleException("MOD ICON: ${errors.size()} error(s)\n  " + errors.join('\n  '))
        }
        logger.lifecycle("checkModIcon: OK (512x512, SHA-256 ${digest})")
    }
}

var checkVendoredDependencies = tasks.register("checkVendoredDependencies") {
    group = 'verification'
    description = 'Verifies that present libs/ dependencies match their recorded SHA-256.'
    def manifestFile = file('RESOURCE_IMPORT_MANIFEST.tsv')
    inputs.file(manifestFile)
    doLast {
        def lines = manifestFile.readLines('UTF-8').findAll { it.trim() && !it.startsWith('#') }
        def header = lines.remove(0).split('\t') as List
        int pathIdx = header.indexOf('path')
        int shaIdx = header.indexOf('sha256')
        def errors = []
        lines.each { line ->
            def cols = line.split('\t') as List
            if (cols.size() <= Math.max(pathIdx, shaIdx)) return
            def entry = file(cols[pathIdx])
            def expected = cols[shaIdx].trim().toLowerCase()
            if (!entry.exists()) {
                logger.lifecycle("checkVendoredDependencies: NOTE ${cols[pathIdx]} is not present locally")
                return
            }
            def actual = sha256Of(entry)
            if (expected in ['', 'pending', 'tbd']) {
                logger.lifecycle("checkVendoredDependencies: NOTE ${cols[pathIdx]} has no recorded digest yet, observed ${actual}")
            } else if (actual != expected) {
                errors << "${cols[pathIdx]}: expected ${expected}, got ${actual}"
            }
        }
        if (errors) {
            throw new GradleException("Vendored dependency digest mismatch:\n  " + errors.join('\n  '))
        }
    }
}

tasks.named('check') {
    dependsOn checkModIcon, checkVendoredDependencies
}

var examplePackZip = tasks.register("examplePackZip", Zip) {
    group = 'build'
    description = 'Packages the data-driven example pack.'
    archiveFileName = "tacz-tweaks-example-pack-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('example-pack')
    from layout.projectDirectory.dir('tacz-tweaks-example-pack')
}

tasks.named('assemble') {
    dependsOn examplePackZip
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
