name: Version consistency

# 版本一致性守门：改了 gradle.properties 却忘了同步 README / BUILD.md / fabric.mod.json 时，PR 会红。
# build.yml 虽然也跑同一脚本，但它 paths-ignore 掉了 *.md 与 docs/**，
# 「只改 README」的提交测不到 —— 本流程必须独立存在。
# 本流程不需要 libs/ 里的 jar（只校验存在的 manifest 行），因此跑得最快，
# 是最先给出反馈的那一条。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - '26.3'
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    paths:
      - 'gradle.properties'
      - 'README.md'
      - 'BUILD.md'
      - 'CHANGELOG.md'
      - 'RESOURCE_IMPORT_MANIFEST.tsv'
      - 'src/main/resources/fabric.mod.json'
      - 'docs/publish/**'
      - 'docs/BRANCHES.md'
      - 'scripts/check_release_consistency.py'
  pull_request:
    paths:
      - 'gradle.properties'
      - 'README.md'
      - 'BUILD.md'
      - 'CHANGELOG.md'
      - 'RESOURCE_IMPORT_MANIFEST.tsv'
      - 'src/main/resources/fabric.mod.json'
      - 'docs/publish/**'
      - 'docs/BRANCHES.md'
      - 'scripts/check_release_consistency.py'
  workflow_dispatch:

concurrency:
  group: consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: README 与 gradle.properties 版本一致性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查当前分支
        run: python3 scripts/check_release_consistency.py

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::README.md / BUILD.md / fabric.mod.json 与 gradle.properties 的版本号不一致。"
          echo "::error::请同步以下位置：顶部版本句 / 支持环境表 / 构建产物路径示例 / fabric.mod.json depends"
          echo "::error::以及 RESOURCE_IMPORT_MANIFEST.tsv 的依赖版本与校验和。"
