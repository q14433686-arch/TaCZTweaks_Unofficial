org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# Run the Kotlin compiler inside the Gradle daemon (avoids a second JVM on low-memory machines)
kotlin.compiler.execution.strategy=in-process

# Minecraft / Fabric (mirrors TaCZ_Refabricated_Unofficial 26.3 branch)
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.160.7+26.3

# Kotlin (matches Fabric Language Kotlin)
flk_version=1.14.1+kotlin.2.4.20

# Mixin extras (bundled)
mixinextras_version=0.5.4

# Project
# Keep the prerelease channel in a Fabric/SemVer-compatible build identifier.
mod_version=2.14.2+fabric.26.3.Beta-1
maven_group=me.muksc
archives_base_name=tacztweaks

# Optional integration compile deps (mirrors target)
# 26.3 ModMenu is still on the beta channel (v21.0.0-beta.1); re-pin once a stable build ships.
modmenu_version=21.0.0-beta.1
