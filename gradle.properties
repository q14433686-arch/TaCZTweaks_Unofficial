# Kotlin 2.4.10 (K2) needs a comfortable CodeCache/Metaspace; an undersized JVM shows up as
# "Out of space in CodeCache for adapters" and knock-on MethodHandle InternalErrors.
# On <2 GB machines override org.gradle.jvmargs (or JAVA_TOOL_OPTIONS) on the command line.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Xss2m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Run the Kotlin compiler inside the Gradle daemon (avoids a second JVM on low-memory machines).
kotlin.compiler.execution.strategy=in-process

# Environment Properties
# Minecraft 26.2 is unobfuscated: no mappings / parchment configuration is needed.
minecraft_version=26.2
minecraft_version_range=[26.2]
# Must agree with TaCZ_Renovated's 26.2 branch.
neo_version=26.2.0.64
neo_version_range=[26.2.0.64,)

# Kotlin (stdlib is jarJar-embedded; NeoForge has no Fabric Language Kotlin equivalent)
kotlin_version=2.4.10

## Mod Properties
mod_id=tacztweaks
mod_name=TaCZ Tweaks (Renovated)
mod_license=GPL-3.0-only
# Build metadata ('+'), never a '-' pre-release: keeps ordering sane for dependents.
mod_version=2.14.2+neoforge.26.2.Beta-1
mod_group_id=me.muksc
