# 默认 JVM 参数（开发机适用）：给 Kotlin 2.4.10 (K2) 编译器足够的 CodeCache / Metaspace，
# 避免出现 "Out of space in CodeCache for adapters" 以及连锁的
# "java.lang.NoSuchMethodException: MethodHandle.linkToStatic(...)" InternalError。
# 这些错误不是 JDK 版本问题，而是 CodeCache 过小把 JIT 适配器塞爆导致的次生异常。
#
# 若在 <2GB 内存的低内存机器/CI 沙箱里构建，请使用下面"低内存档案"里的覆盖命令：
#   - Linux/macOS: export JAVA_TOOL_OPTIONS="..."
#   - Windows cmd: set JAVA_TOOL_OPTIONS=...
# 或直接覆盖 org.gradle.jvmargs（通过 -D 命令行参数或 GRADLE_OPTS/GRADLE_USER_HOME gradle.properties）。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Xss2m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Daemon JVM 与编译 JVM 使用同一进程，避免 fork 出来的 Kotlin daemon 再吃一份内存。
# 在普通机器上这样编译更快，在极端低内存环境里仍可通过环境变量覆盖。
kotlin.compiler.execution.strategy=in-process

