# Kotlin 2.4.10 (K2) needs a comfortable CodeCache/Metaspace; an undersized JVM shows up as
# "Out of space in CodeCache for adapters" and knock-on MethodHandle InternalErrors.
# On <2 GB machines override org.gradle.jvmargs (or JAVA_TOOL_OPTIONS) on the command line.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Xss2m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Run the Kotlin compiler inside the Gradle daemon (avoids a second JVM on low-memory machines).
kotlin.compiler.execution.strategy=in-process

# Environment Properties
# Minecraft 26.3 is unobfuscated: no mappings / parchment configuration is needed.
minecraft_version=26.3
minecraft_version_range=[26.3]
# Must agree with TaCZ_Renovated's 26.3 branch. NeoForge 26.3 is BETA-ONLY on
# maven.neoforged.net; TaCZ_Renovated re-pinned 26.3.0.7-beta -> 26.3.0.51-beta because
# FML 12.0.8 removed ModConfig.Type.COMMON/SERVER (old-beta jars crash with
# NoSuchFieldError on newer loaders). We pin the same build: our compile must agree with
# the TaCZ jar we mix into. Re-pin when NeoForge 26.3 goes release.
neo_version=26.3.0.51-beta
neo_version_range=[26.3.0.51-beta,)

# Kotlin (stdlib is jarJar-embedded; NeoForge has no Fabric Language Kotlin equivalent)
kotlin_version=2.4.10

## Mod Properties
mod_id=tacztweaks
mod_name=TaCZ Tweaks (Renovated)
mod_license=GPL-3.0-only
# Build metadata ('+'), never a '-' pre-release: keeps ordering sane for dependents.
mod_version=2.14.2+neoforge.26.3.Beta-1
mod_group_id=me.muksc
